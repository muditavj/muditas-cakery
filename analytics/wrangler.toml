name = "cakery-analytics"
main = "worker.js"
compatibility_date = "2026-01-01"

# Browsers may only post from the live site. Add http://localhost:8000 while testing locally.
[vars]
ALLOWED_ORIGINS = "https://muditavj.github.io"

[[d1_databases]]
binding = "DB"
database_name = "cakery-analytics"
database_id = "5648c324-7f9e-4b3b-bb4b-8f4a2cbe2d9f"

# Nightly prune of events older than 400 days.
[triggers]
crons = ["17 20 * * *"]
